theme = "default"
rulers = [100]
local_clipboard = false
show_splash = true
watch_open_files = true
always_prompt_on_exit = false
case_insensitive_search = true
render_whitespace = "trailing"
line_number = "absolute"
pipe_shell_palette = true
auto_trim_whitespace = true
auto_format = false
highlight_cursor_line = true
icons = true

[picker]
follow_symlinks = false
show_hidden = true
show_git_folder = false
follow_gitignore = true
follow_git_exclude = true
follow_ignore = true
follow_git_global = true
show_only_text_files = true
file_picker_auto_reload = true

[info_line]
left = ["file", "matches"]
right = ["branch", "position", "encoding", "language", "size", "spinner"]
padding = 1

[git]
inline_blame = true

[gui]
font_family = "FiraCode Nerd Font Mono"
font_weight = "normal"
cursor_type = "line"

[open_rules]
open_git_log_oneline = { match = "^([a-z0-9]{7})\\s.*", cmd = "git show %1%" }
open_git_log = { match = "^commit\\s([a-z0-9]{40,})\\s*.*", cmd = "git show %1%" }
open_manpage = { match = "\\w+\\(\\d+\\)", cmd = "man '%0%'" }


[keymap]
"F5" = { cmd = "run_action", name = "build" }

[actions]
build = ["cargo", "build"]
